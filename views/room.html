<div id="room-state"><div class="skeleton room-skeleton"></div></div>
<div id="room" class="room" hidden>
  <div class="room-main">
    <a class="back-link" href="/matches"><svg class="icon" aria-hidden="true"><use href="/icons.svg#left"/></svg>All matches</a>
    <header class="room-header" aria-labelledby="match-title">
      <p class="room-created"><svg class="icon" aria-hidden="true"><use href="/icons.svg#clock"/></svg><span id="match-created"></span></p>
      <h1 id="match-title" class="display"></h1>
      <p id="match-subtitle" class="room-subtitle"></p>
      <div id="match-chips" class="room-chips"></div>
    </header>
    <ul id="facts" class="room-facts" aria-label="Match settings"></ul>
    <ol id="progress" class="room-timeline" aria-label="Match progress"></ol>
    <div class="room-body">
      <div class="room-left">
        <section id="players" class="room-players" aria-label="Players"></section>
        <section id="action" class="action panel" aria-live="polite"></section>
        <div id="secondary" class="secondary"></div>
      </div>
      <aside id="rules" class="room-rules panel" aria-labelledby="rules-title"></aside>
    </div>
  </div>
  <aside id="chat" class="room-chat" aria-labelledby="chat-title">
    <div class="chat-head">
      <h2 id="chat-title">Match Chat</h2>
      <span id="chat-connection" class="chat-connection" role="status"></span>
      <b id="chat-unread" class="chat-unread num" hidden></b>
      <button id="chat-toggle" class="btn btn-quiet btn-icon btn-small" type="button" aria-expanded="true" aria-controls="chat-body" aria-label="Collapse chat"><svg class="icon" aria-hidden="true"><use href="/icons.svg#right"/></svg></button>
    </div>
    <div id="chat-body" class="chat-body">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="Match activity and messages" tabindex="0"></div>
      <button id="chat-jump" class="chat-jump" type="button" hidden>New messages<svg class="icon" aria-hidden="true"><use href="/icons.svg#down"/></svg></button>
      <form id="chat-form" class="chat-form" hidden><label class="sr-only" for="chat-input">Message</label><input id="chat-input" class="input" maxlength="500" autocomplete="off" disabled><button id="chat-send" class="btn btn-primary btn-icon" type="submit" aria-label="Send message" disabled><svg class="icon" aria-hidden="true"><use href="/icons.svg#send"/></svg></button></form>
      <p id="chat-spectator" class="chat-spectator" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#info"/></svg>You are not participating in this match.</p>
    </div>
  </aside>
</div>
