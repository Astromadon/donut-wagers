<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.spin{transform-origin:100px 100px;animation:spin 6s linear infinite}.spin-slow{transform-origin:100px 100px;animation:spin 18s linear infinite}.spin-back{transform-origin:100px 100px;animation:spin 24s linear infinite reverse}.tw{animation:tw 2.4s ease-in-out infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.flick{transform-origin:100px 170px;animation:flick 1.4s ease-in-out infinite alternate}.drip{animation:drip 3s ease-in infinite}.bob{animation:bob 3s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes flick{from{transform:scaleY(.94) skewX(-1.5deg)}to{transform:scaleY(1.05) skewX(1.5deg)}}@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(16px);opacity:0}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd1f5"/><stop offset="0.5" stop-color="#e36bd0"/><stop offset="1" stop-color="#7a2a8f"/></linearGradient><filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="100" cy="100" r="70" fill="none" stroke="#2b0f2f" stroke-width="8" /><circle cx="100" cy="100" r="70" fill="none" stroke="url(#cr)" stroke-width="5" filter="url(#g)"/><path d="M100 4V-40" stroke="#ffb3ef" stroke-width="3"/><g class="bob" filter="url(#g)"><g class="spin" style="transform-origin:100px 26px"><rect x="86" y="12" width="28" height="28" fill="none" stroke="#ffe6fa" stroke-width="2.5" transform="rotate(45 100 26)"/></g><rect x="91" y="17"